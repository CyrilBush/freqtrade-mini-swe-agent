name: Build Documentation

on:
  push:
    branches:
      - develop
  release:
    types: [published]


# disable permissions for all of the available permissions
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements-docs.txt

      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages --depth=1

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy development documentation
        if: github.event_name == 'push'
        run: mike deploy --push --update-aliases ${{ github.ref_name }} latest

      - name: Deploy release documentation
        if: github.event_name == 'release'
        run: mike deploy --push --update-aliases ${{ github.ref_name }} stable

      - name: List deployed documentation versions
        run: mike list
